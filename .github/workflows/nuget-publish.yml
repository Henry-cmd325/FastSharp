name: Publish NuGet packages

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    environment: nuget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Pack
        run: |
          # Extraemos el número de versión (quitando la 'v')
          VERSION=${GITHUB_REF_NAME#v}

          dotnet pack FastSharp.Models/FastSharp.Models.csproj -c Release -o ./artifacts --no-build /p:PackageVersion=$VERSION
          dotnet pack FastSharp.Modules/FastSharp.Modules.csproj -c Release -o ./artifacts --no-build /p:PackageVersion=$VERSION

      - name: Publish to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
