name: Publish NuGet packages

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    environment: nuget
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: |
          #Sacamos la versión aquí para que el Build ya la tenga
          VERSION=${GITHUB_REF_NAME#v}
          dotnet build -c Release --no-restore /p:Version=$VERSION

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Pack
        run: |
          # Extraemos el número de versión (quitando la 'v')
          VERSION=${GITHUB_REF_NAME#v}

          dotnet pack FastSharp.Models/FastSharp.Models.csproj -c Release -o ./artifacts --no-build /p:Version=$VERSION
          dotnet pack FastSharp.Modules/FastSharp.Modules.csproj -c Release -o ./artifacts --no-build /p:Version=$VERSION
          dotnet pack FastSharp.Templates/FastSharp.Templates.csproj -c Release -o ./artifacts --no-build /p:Version=$VERSION

      - name: Validate packed template dependency
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          TEMPLATE_PROJECT=content/content/FastSharp.Template.Api/FastSharpApi.csproj
          TEMPLATE_PACKAGE=./artifacts/FastSharp.Templates.$VERSION.nupkg
          TEMPLATE_PACKAGE="$TEMPLATE_PACKAGE" TEMPLATE_PROJECT="$TEMPLATE_PROJECT" VERSION="$VERSION" python3 - <<'PY'
          import os
          import sys
          import zipfile
          import xml.etree.ElementTree as ElementTree

          package_path = os.environ["TEMPLATE_PACKAGE"]
          project_path = os.environ["TEMPLATE_PROJECT"]
          version = os.environ["VERSION"]

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          if not os.path.isfile(package_path):
              fail(f"Missing packed template package: {package_path}")

          try:
              with zipfile.ZipFile(package_path) as package:
                  if project_path not in package.namelist():
                      fail(f"Missing embedded template project '{project_path}' in '{package_path}'.")
                  project_contents = package.read(project_path)
          except zipfile.BadZipFile:
              fail(f"Packed template package is not a valid NuGet archive: {package_path}")
          except OSError as error:
              fail(f"Could not read packed template package '{package_path}': {error}")

          if b"__FASTSHARP_MODULES_VERSION__" in project_contents:
              fail(f"Unresolved FastSharp.Modules version token in '{project_path}'.")

          try:
              project = ElementTree.fromstring(project_contents)
          except ElementTree.ParseError as error:
              fail(f"Embedded template project '{project_path}' is not valid XML: {error}")

          modules_references = [
              reference for reference in project.iter()
              if reference.tag.rsplit("}", 1)[-1] == "PackageReference"
              and reference.get("Include") == "FastSharp.Modules"
          ]
          if len(modules_references) != 1:
              fail(
                  f"Expected exactly one FastSharp.Modules PackageReference in '{project_path}', "
                  f"found {len(modules_references)}."
              )

          package_version = modules_references[0].get("Version")
          if package_version != version:
              fail(
                  f"FastSharp.Modules PackageReference version in '{project_path}' is "
                  f"'{package_version}', expected tag-derived version '{version}'."
              )
          PY

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
         user: ${{ secrets.NUGET_USERNAME }}

      - name: Publish to NuGet
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          dotnet nuget push "./artifacts/FastSharp.Models.$VERSION.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "./artifacts/FastSharp.Modules.$VERSION.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "./artifacts/FastSharp.Templates.$VERSION.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
