schema: spec-driven

context: |
  Tech stack: .NET 10 / C# / ASP.NET Core Minimal APIs (NuGet library). Solution: FastSharp.slnx.
  Projects: FastSharp.Modules (net10.0 core), FastSharp.Models (netstandard2.0 abstractions),
  FastSharp.Generators (netstandard2.0 source generators), FastSharp.Tests (xunit), Samples/QuickStart.
  Architecture: module-first, endpoint-per-class (IEndpoint.Map), optional CRUD via AddCRUD<TEntity,TKey>.
  Assembly scanning via AddFastSharpEndpoints/MapFastSharpEndpoints. No controllers.
  Testing: xunit 2.8.1, integration via TestHost + EF Core InMemory, coverage via coverlet.
  Style: English code/comments/docs, route prefixes with leading slash, auth via native Minimal API chaining.

persistence: hybrid

testing:
  strict_tdd: true
  test_command: dotnet test FastSharp.Tests/FastSharp.Tests.csproj -c Release --no-build --verbosity normal
  framework: xunit
  layers:
    unit: true
    integration: true
    e2e: false
  coverage:
    available: true
    command: dotnet test FastSharp.Tests/FastSharp.Tests.csproj --collect:"XPlat Code Coverage"

rules:
  proposal:
    - Include rollback plan for risky changes
    - Frame features as modules + endpoints first, CRUD optional
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
    - Preserve native Minimal API metadata chaining compatibility
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns in FastSharp.Modules
    - English for all code, comments, and documentation
    tdd: true
    test_command: dotnet test FastSharp.Tests/FastSharp.Tests.csproj -c Release --no-build --verbosity normal
  verify:
    test_command: dotnet test FastSharp.Tests/FastSharp.Tests.csproj -c Release --no-build --verbosity normal
    build_command: dotnet build -c Release --no-restore
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - Keep docs/how-to-fastsharp.md aligned with the public API
